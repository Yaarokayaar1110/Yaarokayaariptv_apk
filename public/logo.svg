<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <rect width="500" height="500" fill="#000000" rx="40" />
  
  <!-- Emblem Group -->
  <g transform="translate(0, 10)">
    <!-- Top White Triangle -->
    <polygon points="170,60 292,130 170,200" fill="#FFFFFF" />

    <!-- Dividing Diagonal Line (Slices through with protrusions) -->
    <line x1="140" y1="216" x2="318" y2="116" stroke="#FFFFFF" stroke-width="7" stroke-linecap="square" />

    <!-- Bottom Red-Orange Triangle -->
    <polygon points="202,192 322,126 322,266" fill="#F04E23" />
  </g>

  <!-- Typography -->
  <!-- YAARO KA YAAR -->
  <text 
    x="250" 
    y="336" 
    text-anchor="middle" 
    fill="#FFFFFF" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Montserrat', 'Arial Black', sans-serif" 
    font-size="36" 
    font-weight="900" 
    letter-spacing="5"
  >
    YAARO KA YAAR
  </text>

  <!-- Subtitle -->
  <text 
    x="250" 
    y="375" 
    text-anchor="middle" 
    fill="#F04E23" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Montserrat', 'Arial Black', sans-serif" 
    font-size="14.5" 
    font-weight="800" 
    letter-spacing="5"
  >
    YOUTUBE CHANNAL...
  </text>
</svg>
